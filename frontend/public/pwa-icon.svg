<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hexagon Gradients -->
    <linearGradient id="hexLeft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    
    <linearGradient id="hexRight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Shield Gradients -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    
    <!-- Circuit Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Circuit Lines (behind hexagon and shield) -->
    <!-- Top line -->
    <path d="M 280 230 L 400 130 L 450 130" fill="none" stroke="url(#circuitGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="450" cy="130" r="14" fill="#38bdf8" />
    <circle cx="450" cy="130" r="6" fill="#ffffff" />
    
    <!-- Middle line -->
    <path d="M 300 270 L 420 170 L 470 170" fill="none" stroke="url(#circuitGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="470" cy="170" r="14" fill="#38bdf8" />
    <circle cx="470" cy="170" r="6" fill="#ffffff" />

    <!-- Bottom line -->
    <path d="M 320 310 L 400 240 L 440 240" fill="none" stroke="url(#circuitGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="440" cy="240" r="14" fill="#38bdf8" />
    <circle cx="440" cy="240" r="6" fill="#ffffff" />

    <!-- Hexagon -->
    <!-- Left path (Green/Blue gradient) -->
    <path d="M 256 60 L 90 155 L 90 345 L 256 440" fill="none" stroke="url(#hexLeft)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right path (Blue gradient) -->
    <path d="M 256 440 L 422 345 L 422 155 L 256 60" fill="none" stroke="url(#hexRight)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Shield -->
    <!-- Left half -->
    <path d="M 256 110 L 140 160 L 140 280 C 140 360, 200 400, 256 430 Z" fill="url(#shieldLeft)" />
    <!-- Right half -->
    <path d="M 256 110 L 372 160 L 372 280 C 372 360, 312 400, 256 430 Z" fill="url(#shieldRight)" />

    <!-- Checkmark Base (White) -->
    <path d="M 150 270 L 220 340 L 390 150" fill="none" stroke="#ffffff" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Checkmark Top (Green Gradient) -->
    <path d="M 150 270 L 220 340 L 390 150" fill="none" stroke="url(#checkGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
