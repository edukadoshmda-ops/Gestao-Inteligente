[build]
  command = "npm ci --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

# Configuração das Functions
[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/package.json"]
  external_node_modules = ["@supabase/supabase-js", "axios"]

[dev]
  command = "npm run dev"
  port = 8889
  targetPort = 3000
  autoLaunch = false

# Variáveis de ambiente para as Functions (sem prefixo VITE_)
[functions.environment]
  SUPABASE_URL = ""
  SUPABASE_SERVICE_ROLE_KEY = ""
  SUPABASE_ANON_KEY = ""
  SITE_URL = ""
  ASAAS_API_KEY = ""
  RESEND_API_KEY = ""
  EMAIL_FROM = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
